name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinned-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: scripts/package.json

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "26.7.0"
          cache: pnpm
          cache-dependency-path: scripts/pnpm-lock.yaml

      - name: Download modules
        run: go mod download

      - name: Check
        env:
          PATCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check PATCH_BASE="$PATCH_BASE"

  compatibility:
    name: Go ${{ matrix.go-version }} compatibility
    runs-on: ubuntu-latest
    env:
      # Prevent go.mod's preferred toolchain from masking minimum-version failures.
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.0", "stable"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify supported interval
        run: make check-go-version

      - name: Test
        run: go test -count=1 ./...
